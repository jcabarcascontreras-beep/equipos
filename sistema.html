<style>
:root{
  --brand:#00A098; --brand-ink:#00756E; --pri-bg:#00756E; --pri-ink:#FFFFFF;
  --side:#0D2426; --side-ink:#D5E7E5; --side-muted:#86A9A6; --side-hover:#15373A; --side-active:#1C474A;
  --bg:#EEF3F3; --panel:#FFFFFF; --ink:#132527; --muted:#566C6E; --line:#D6E1E1; --soft:#F4F8F8;
  --done:#00A098; --done-soft:#D9F1EF; --done-ink:#00675F;
  --late:#C4382D; --late-soft:#FBE6E3; --late-ink:#A12D23;
  --due:#C27A0E; --due-soft:#FCEFD9; --due-ink:#8A5608;
  --plan:#7D9395; --plan-soft:#E6EDED; --plan-ink:#566C6E;
  --num:"Barlow Semi Condensed","Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#2FC4B9; --brand-ink:#5FD6CC; --pri-bg:#2FC4B9; --pri-ink:#062321;
  --side:#071517; --side-hover:#102A2D; --side-active:#16393C;
  --bg:#0C1A1C; --panel:#132628; --ink:#E4EEED; --muted:#93AAA9; --line:#24393B; --soft:#172D30;
  --done:#2FC4B9; --done-soft:#123A37; --done-ink:#6FDCD2;
  --late:#F0685B; --late-soft:#3A1D1A; --late-ink:#FF9D93;
  --due:#EBA93F; --due-soft:#382A13; --due-ink:#F6C877;
  --plan:#7E9798; --plan-soft:#1C3336; --plan-ink:#A7BCBC;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --brand:#2FC4B9; --brand-ink:#5FD6CC; --pri-bg:#2FC4B9; --pri-ink:#062321;
  --side:#071517; --side-hover:#102A2D; --side-active:#16393C;
  --bg:#0C1A1C; --panel:#132628; --ink:#E4EEED; --muted:#93AAA9; --line:#24393B; --soft:#172D30;
  --done:#2FC4B9; --done-soft:#123A37; --done-ink:#6FDCD2;
  --late:#F0685B; --late-soft:#3A1D1A; --late-ink:#FF9D93;
  --due:#EBA93F; --due-soft:#382A13; --due-ink:#F6C877;
  --plan:#7E9798; --plan-soft:#1C3336; --plan-ink:#A7BCBC;
  color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}
body:not(.editor) .editor-only{display:none!important}

/* ---------- estructura ---------- */
.app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;padding:24px 14px 18px;z-index:20}
.side .logo{padding:4px 10px 26px}
.side .logo img{width:156px;height:auto;display:block}
.side .logo span{display:block;color:var(--side-muted);font-size:.84rem;margin-top:10px;line-height:1.3}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--side-ink);padding:11px 12px;border-radius:10px;font-weight:700;text-align:left;font-size:.98rem}
.nav button svg{width:21px;height:21px;flex:none;opacity:.8}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-current="page"]{background:var(--side-active);color:#fff;box-shadow:inset 3px 0 0 var(--brand)}
.nav button[aria-current="page"] svg{opacity:1;color:var(--brand)}
.nav .l-s{display:none}
.nav .badge{margin-left:auto;background:#D9483B;color:#fff;border-radius:999px;padding:0 7px;font-size:.76rem;line-height:1.35rem;min-width:1.35rem;text-align:center;font-family:var(--num);font-weight:600}
.side .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.08);font-size:.84rem;color:var(--side-muted);overflow-wrap:anywhere}
.main{min-width:0;padding:0 40px 56px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:30px 0 22px;max-width:1280px;margin:0 auto}
.top h1{font-family:var(--num);font-weight:700;font-size:2.2rem;line-height:1.05;margin:0}
.top p{margin:6px 0 0;color:var(--muted);max-width:62ch}
.top .acts{display:flex;gap:8px;flex:none}
.mlogo{display:none}
.view{max-width:1280px;margin:0 auto}
.status{max-width:1280px;margin:0 auto 16px;background:var(--due-soft);color:var(--due-ink);border-radius:12px;padding:12px 16px;font-weight:700}
.status.err{background:var(--late-soft);color:var(--late-ink)}

/* ---------- controles ---------- */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:700;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-ink)}
.btn.sm{min-height:34px;padding:4px 11px;font-size:.88rem}
.btn svg{width:18px;height:18px}
.icon{width:42px;padding:0}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px;width:100%}
textarea{min-height:0}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.tools input[type=search]{flex:1 1 260px;width:auto}
.tools select{width:auto;flex:0 1 auto;max-width:100%}
.tools .sp{flex:1 1 0}
.count{color:var(--muted);font-size:.92rem;margin:0 0 10px}
.more{display:block;margin:14px auto 0}
h2.sec{font-family:var(--num);font-size:1.35rem;font-weight:600;margin:36px 0 14px;line-height:1.2}
h2.sec small{font-family:"Atkinson Hyperlegible",sans-serif;font-size:.85rem;font-weight:400;color:var(--muted);margin-left:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px}
.panel h3{margin:0 0 4px;font-size:1.02rem}
.panel .hint{margin:0 0 16px;color:var(--muted);font-size:.9rem}
.empty{color:var(--muted);padding:18px 20px;margin:0}

/* tonos */
.t-late{--tone:var(--late);--tone-soft:var(--late-soft);--tone-ink:var(--late-ink)}
.t-due{--tone:var(--due);--tone-soft:var(--due-soft);--tone-ink:var(--due-ink)}
.t-done{--tone:var(--done);--tone-soft:var(--done-soft);--tone-ink:var(--done-ink)}
.t-plan{--tone:var(--plan);--tone-soft:var(--plan-soft);--tone-ink:var(--plan-ink)}
.chip{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:.86rem;background:var(--tone-soft);color:var(--tone-ink)}

/* ---------- inicio ---------- */
.hero{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:36px;align-items:stretch;padding:26px 30px 22px;border-radius:20px}
.hero h2{font-size:1.05rem;margin:0}
.hero .big{font-family:var(--num);font-weight:700;font-size:6rem;line-height:.95;margin:14px 0 4px;font-variant-numeric:tabular-nums;color:var(--tone-ink)}
.hero .big small{font-size:.42em;font-weight:600;margin-left:4px;color:var(--muted)}
.hero .lead{margin:0;font-weight:700}
.hero .hn{color:var(--muted);margin:10px 0 0;font-size:.93rem;max-width:36ch}
.hero .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;height:210px}
.strip button{display:grid;grid-template-rows:minmax(0,1fr) auto;background:none;border:0;padding:0 0 2px;border-radius:8px;min-width:0}
.strip button:hover .bar{filter:brightness(1.07)}
.strip .col{position:relative}
.strip .bar{position:absolute;left:12%;right:12%;bottom:0;display:flex;flex-direction:column-reverse;border-radius:6px 6px 3px 3px;overflow:hidden}
.strip .bar i{display:block;min-height:0}
.strip .n{position:absolute;left:0;right:0;text-align:center;font-family:var(--num);font-size:.84rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1}
.i-d{background:var(--done)} .i-l{background:var(--late)} .i-u{background:var(--due)}
.i-p{background:repeating-linear-gradient(135deg,var(--plan-soft) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px var(--plan)}
.strip .m{font-size:.8rem;text-align:center;padding-top:8px;color:var(--muted);font-weight:700;border-top:1px solid var(--line)}
.strip .now .m{color:var(--ink)}
.strip .now .m::after{content:"";display:block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin:3px auto 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:4px}
.kpi h3{margin:0;font-size:.93rem;font-weight:700;color:var(--muted)}
.kpi .val{font-family:var(--num);font-weight:700;font-size:2.7rem;line-height:1;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:.48em;color:var(--muted);font-weight:600;margin-left:4px}
.meter{position:relative;height:7px;border-radius:4px;background:var(--plan-soft);margin:8px 0 6px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--tone)}
.meter b{position:absolute;top:-4px;width:2px;height:15px;background:var(--ink);opacity:.5;border-radius:1px}
.kpi .foot{margin:auto 0 0;font-size:.86rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.srv{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.srv button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;width:100%;background:none;border:0;padding:0;text-align:left}
.srv .nm{font-weight:700;font-size:.93rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv .pc{font-family:var(--num);font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
.srv .tr{grid-column:1/-1;display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--plan-soft)}
.srv .sub{grid-column:1/-1;font-size:.82rem;color:var(--muted)}

/* ---------- listas ---------- */
.rows{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel .rows{border:0;border-radius:0;margin:0 -22px -20px;border-top:1px solid var(--line)}
.rows li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:5px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;background:none;border:0;text-align:left;padding:12px 18px 12px 0}
.row:hover{background:var(--soft)}
.row .bar{align-self:stretch;border-radius:0 3px 3px 0;background:var(--tone)}
.row b{display:block;font-weight:700}
.row .sub{display:block;color:var(--muted);font-size:.87rem;line-height:1.35}
.row .rt{text-align:right;font-size:.88rem;color:var(--tone-ink);font-weight:700;line-height:1.3}
.row .rt span{display:block;font-weight:400;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 12px;font-weight:700;font-size:.9rem;display:inline-flex;gap:8px;align-items:center}
.seg button b{font-family:var(--num);font-size:1.05rem;color:var(--tone-ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.seg button[aria-pressed="true"] b{color:inherit}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--tone);border-radius:12px;padding:12px 14px;text-align:left}
.tile strong{display:block;font-family:var(--num);font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.87rem}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--tone)}
.log{width:100%;border-collapse:collapse;font-size:.9rem}
.log th,.log td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.log th{color:var(--muted);font-weight:700}
.log td.n{font-family:var(--num);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- cronograma ---------- */
.tablewrap{overflow:auto;max-height:calc(100vh - 230px);background:var(--panel);border:1px solid var(--line);border-radius:14px}
table.crono{border-collapse:separate;border-spacing:0;width:100%;min-width:960px}
.crono th,.crono td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.crono thead th{position:sticky;top:0;background:var(--panel);font-size:.8rem;color:var(--muted);font-weight:700;z-index:3;padding-top:12px;padding-bottom:10px}
.crono thead th.now{color:var(--ink);box-shadow:inset 0 -3px 0 var(--brand)}
.crono .eq{position:sticky;left:0;background:var(--panel);text-align:left;min-width:250px;z-index:2;padding-left:16px;padding-right:12px;font-weight:400}
.crono thead .eq{z-index:4}
.crono .eq button{background:none;border:0;padding:0;font-weight:700;text-align:left;color:var(--ink);line-height:1.3}
.crono .eq button:hover{text-decoration:underline}
.crono .eq small{display:block;color:var(--muted);font-size:.79rem;line-height:1.35}
.crono .per{font-size:.8rem;color:var(--muted);text-align:left;white-space:nowrap;padding-right:10px;width:104px}
.crono thead th.mh{width:44px}
.crono td.nowc{background:var(--soft)}
.crono tr.grp th{background:var(--soft);text-align:left;font-family:var(--num);font-size:1.05rem;font-weight:600;padding:9px 16px}
.crono tr.grp th span{font-family:"Atkinson Hyperlegible",sans-serif;font-size:.84rem;color:var(--muted);font-weight:400;margin-left:8px}
.cell{width:30px;height:30px;border-radius:7px;border:0;padding:0;display:inline-grid;place-items:center;background:transparent;vertical-align:middle;font-size:.72rem;font-weight:700}
.cell svg{width:16px;height:16px}
.cell.done{background:var(--done);color:#fff}
.cell.done.ns{background:var(--done-soft);color:var(--done-ink);box-shadow:inset 0 0 0 1.5px var(--done)}
.cell.late{background:var(--late);color:#fff}
.cell.due{background:var(--due);color:#fff}
.cell.plan{background:var(--plan-soft);box-shadow:inset 0 0 0 1.5px var(--plan)}
.cell.ing{color:var(--muted)}
body.editor button.cell.none:hover{box-shadow:inset 0 0 0 1.5px var(--line)}
button.cell:hover{filter:brightness(1.08)}
.ms{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px;text-align:center;margin:4px 0 18px}
.ms span{font-size:.72rem;color:var(--muted);font-weight:700}
.ms .cell{width:100%;max-width:34px;margin:0 auto;height:30px}
.ms .cell.none{box-shadow:inset 0 0 0 1px var(--line)}

/* ---------- hoja lateral ---------- */
.sheet{position:fixed;inset:0;z-index:50;visibility:hidden}
.sheet.open{visibility:visible}
.sheet .scrim{position:absolute;inset:0;background:rgba(5,18,20,.5);opacity:0;transition:opacity .2s}
.sheet.open .scrim{opacity:1}
.sheet .card{position:absolute;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);overflow:auto;padding:0 26px calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(24px);opacity:0;transition:transform .2s,opacity .2s}
.sheet.open .card{transform:none;opacity:1}
.sheet .hd{position:sticky;top:0;background:var(--panel);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top,0px)) 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px;z-index:2}
.sheet .hd h2{font-family:var(--num);font-size:1.5rem;margin:0;line-height:1.15}
.sheet h3{font-size:1rem;margin:26px 0 10px}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin:0}
.dl .w{grid-column:1/-1}
.dl dt{font-size:.8rem;color:var(--muted)}
.dl dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{min-width:0}
.field.w{grid-column:1/-1}
.field label{display:block;font-size:.86rem;font-weight:700;margin-bottom:5px}
.field p{margin:6px 0 0;color:var(--muted);font-size:.86rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 14px 16px}
.timeline li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--tone,var(--brand))}
.timeline .when{color:var(--muted);font-size:.88rem}
.timeline a{color:var(--brand-ink);font-weight:700}
.files{padding-left:18px;margin:0}
.files li{margin-bottom:6px}
.files a{color:var(--brand-ink);font-weight:700}
.note{background:var(--soft);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:.9rem;margin:14px 0 0}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 18px;border-radius:12px;font-weight:700;z-index:80;display:none;max-width:calc(100% - 32px);text-align:center}
.rep{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.rep .panel{display:flex;flex-direction:column}
.rep .panel .actions{margin-top:auto;padding-top:14px}

/* ---------- celular ---------- */
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.cols,.rep{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));box-shadow:0 -1px 0 rgba(255,255,255,.06)}
  .side .logo,.side .foot{display:none}
  .nav{flex-direction:row;gap:0}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;font-size:.66rem;padding:7px 0 6px;text-align:center;justify-content:center;letter-spacing:-.01em}
  .nav .l-l{display:none}.nav .l-s{display:block}
  .nav button[aria-current="page"]{box-shadow:inset 0 3px 0 var(--brand)}
  .nav .badge{position:absolute;top:3px;left:calc(50% + 5px);margin:0;font-size:.68rem;line-height:1.1rem;min-width:1.1rem;padding:0 5px}
  .main{padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 16px;flex-wrap:wrap;align-items:center}
  .mlogo{display:block;flex:1 1 auto;order:0}
  .top .acts{order:1}
  .top .tt{order:2;flex:1 1 100%}
  .tools select{flex:1 1 calc(50% - 5px)}
  .mlogo img{width:118px;display:block}
  .top h1{font-size:1.7rem}
  .hero{grid-template-columns:1fr;gap:22px;padding:20px 18px}
  .hero .big{font-size:4.4rem}
  .strip{height:160px;gap:3px}
  .strip .n{display:none}
  .strip .m{font-size:.7rem}
  .kpi .val{font-size:2.2rem}
  .panel{padding:18px 16px}
  .panel .rows{margin:0 -16px -18px}
  .tablewrap{max-height:none}
  .sheet .card{top:6vh;border-radius:18px 18px 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(24px)}
  .sheet .hd{padding-top:18px}
  .form{grid-template-columns:1fr}
  .row .rt{font-size:.8rem}
  .seg{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px;scrollbar-width:none}
  .seg button{flex:none}
}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}.kpi .val{font-size:1.9rem}.tiles{gap:8px}}
@media (prefers-reduced-motion:reduce){.sheet .scrim,.sheet .card{transition:none}}
@media print{
  .side,.top .acts,.seg,.tools,.btn,.more,#toast,.sheet{display:none!important}
  .app{display:block}.main{padding:0}body{background:#fff}
  .panel,.kpi,.hero{break-inside:avoid}
}
</style>
</head>

/* ===== Metas de los indicadores (se pueden cambiar aquí) ===== */

/* ===== utilidades ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const HOY=new Date(), TODAY=iso(HOY), NOW={y:HOY.getFullYear(),m:HOY.getMonth()+1};
const plus=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const in30=plus(30), in60=plus(60);
function addMonths(s,m){if(!s)return'';const[y,mo,da]=s.split('-').map(Number);return iso(new Date(y,mo-1+Number(m),da))}
function fmt(s){if(!s)return'—';const[y,m,d]=String(s).split('-');return d?d+'/'+m+'/'+y:s}
function slug(t){return (t||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sin-servicio'}
const normSerie=s=>{s=String(s||'').toUpperCase().trim();return ['','N/P','N/A','NA','S/N','NONE'].includes(s)?'':s.replace(/[^A-Z0-9]/g,'')};
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const Cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const PERIODOS={MENSUAL:1,BIMESTRAL:2,TRIMESTRAL:3,CUATRIMESTRAL:4,SEMESTRAL:6,ANUAL:12};
const pc=(a,b)=>b?Math.round(a/b*100):null;
const ICON={done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',late:'!',due:'',plan:'',ing:'IN',none:''};
ICON['done ns']=ICON.done;
const LBL={done:'realizado con soporte','done ns':'realizado, falta soporte digital',late:'atrasado',due:'toca este mes',plan:'programado',ing:'ingreso del equipo',none:'sin programar'};

function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',3200)}
function setStatus(t,err){const s=$('#status');if(!t){s.hidden=true;return}s.hidden=false;s.textContent=t;s.classList.toggle('err',!!err)}
function errMsg(err){const c=(err&&err.code)||'';if(c.includes('permission'))return'No tienes permiso para guardar. Entra con tu usuario o revisa las reglas de Firebase.';if(c.includes('unavailable'))return'Sin conexión. Revisa el internet e intenta de nuevo.';return'No se guardó ('+(c||err?.message||'error')+'). Intenta de nuevo.'}

/* ===== estado ===== */
let user=null, servicios={}, equipos=[], prevDocs={}, items=[], anio=NOW.y, anios=[], S=null;
let loadedS=false, loadedP=false, errP=false, hist=null, histCargando=false, registro;
let view='inicio', abierto=null;
const F={alerta:'atr',aq:'',aLim:120,cq:'',cServ:'',cEst:'',cMes:'',cLim:150,eq:'',eServ:'',eEst:'',eLim:80,calTile:'venc',calq:'',calServ:'',calLim:80};
const urlId=new URLSearchParams(location.search).get('id');

/* ===== inventario y calibraciones ===== */
const EST={venc:'Vencida',por:'Por vencer',sin:'Sin calibración',ok:'Vigente',nr:'No requiere',baja:'De baja'};
const TONE_CAL={venc:'late',sin:'late',por:'due',ok:'done',nr:'plan',baja:'plan'};
function estadoCal(e){
  if(e.baja)return'baja';
  if((e.metrologia||'').toUpperCase()==='NO REQUIERE'||!e.metrologia)return'nr';
  if(!e.vence)return'sin';
  if(e.vence<TODAY)return'venc';
  if(e.vence<=in30)return'por';
  return'ok';
}
function rebuildEquipos(){
  const list=[];
  for(const[sid,sv] of Object.entries(servicios))for(const[id,e] of Object.entries(sv.equipos||{}))list.push(Object.assign({},e,{id,sid,servicio:sv.nombre||sid}));
  list.forEach(e=>{e.est=estadoCal(e);e.txt=[e.inv,e.equipo,e.marca,e.modelo,e.serie,e.servicio,e.ubicacion,e.id].join(' ').toLowerCase()});
  list.sort((a,b)=>(a.orden||9e15)-(b.orden||9e15));
  equipos=list;
  const opts=Object.entries(servicios).sort((a,b)=>(a[1].nombre||'').localeCompare(b[1].nombre||''));
  for(const sel of [$('#eServ'),$('#calServ')]){const cur=sel.value;sel.innerHTML='<option value="">Todos los servicios</option>'+opts.map(([id,s])=>`<option value="${esc(id)}">${esc(s.nombre)} (${Object.keys(s.equipos||{}).length})</option>`).join('');sel.value=cur}
}
const byId=id=>equipos.find(e=>e.id===id);
const refS=sid=>doc(db,'servicios',sid);
async function patchEquipo(e,patch){await setDoc(refS(e.sid),{equipos:{[e.id]:patch}},{merge:true})}
function calStats(){
  const act=equipos.filter(e=>e.est!=='baja'), req=act.filter(e=>e.est!=='nr');
  const g=k=>act.filter(e=>e.est===k);
  const soon=act.filter(e=>e.vence&&e.vence>=TODAY&&e.vence<=in60&&e.est!=='nr');
  return{act,req,alDia:req.filter(e=>e.est==='ok'||e.est==='por').length,venc:g('venc'),por:g('por'),sin:g('sin'),ok:g('ok'),soon};
}

/* ===== mantenimiento preventivo ===== */
function rebuildPrev(){
  anios=[...new Set(Object.values(prevDocs).map(d=>Number(d.anio)).filter(Boolean))].sort((a,b)=>a-b);
  if(!anios.includes(anio))anio=anios.includes(NOW.y)?NOW.y:(anios.length?anios[anios.length-1]:NOW.y);
  const list=[];
  for(const[did,d] of Object.entries(prevDocs)){
    if(Number(d.anio)!==anio)continue;
    for(const[id,it] of Object.entries(d.items||{}))list.push(Object.assign({},it,{id,did,servicio:d.servicio||did,meses:it.meses||{},ejec:it.ejec||{}}));
  }
  list.forEach(it=>{it.e=estadoItem(it);it.txt=[it.eq,it.marca,it.modelo,it.serie,it.af,it.servicio,it.area,it.ubic,it.invima].join(' ').toLowerCase()});
  list.sort((a,b)=>a.servicio.localeCompare(b.servicio)||(a.orden||9e15)-(b.orden||9e15));
  items=list;S=calcular();
  const docsAnio=Object.entries(prevDocs).filter(([,d])=>Number(d.anio)===anio).sort((a,b)=>(a[1].servicio||'').localeCompare(b[1].servicio||''));
  const cs=$('#cServ'),cur=cs.value;
  cs.innerHTML='<option value="">Todos los servicios</option>'+docsAnio.map(([id,d])=>`<option value="${esc(id)}">${esc(d.servicio)} (${Object.keys(d.items||{}).length})</option>`).join('');
  cs.value=docsAnio.some(([id])=>id===cur)?cur:'';F.cServ=cs.value;
  const ca=$('#cAnio');ca.hidden=anios.length<2;ca.innerHTML=anios.map(y=>`<option ${y===anio?'selected':''}>${y}</option>`).join('');
}
const itemKey=(did,id)=>items.find(x=>x.did===did&&x.id===id);
function cmpMes(m){if(anio<NOW.y)return -1;if(anio>NOW.y)return 1;return m<NOW.m?-1:m>NOW.m?1:0}
function esSiguiente(m){return (anio===NOW.y&&m===NOW.m+1)||(NOW.m===12&&anio===NOW.y+1&&m===1)}
function mesesDe(it){const r=[];for(let m=1;m<=12;m++){const v=it.meses['m'+m];if(v==='P'||v==='R')r.push(m)}return r}
function estadoItem(it){
  if(it.fuera)return{st:'fuera',late:[],cur:null,next:null};
  const ms=mesesDe(it),v=m=>it.meses['m'+m];
  if(!ms.length)return{st:'na',late:[],cur:null,next:null};
  const late=ms.filter(m=>v(m)==='P'&&cmpMes(m)<0);
  const cur=ms.find(m=>v(m)==='P'&&cmpMes(m)===0)||null;
  const next=ms.find(m=>v(m)==='P'&&cmpMes(m)>0)||null;
  return{st:late.length?'atr':cur?'mes':(next&&esSiguiente(next))?'prox':'ok',late,cur,next};
}
const ESTP={atr:'Atrasado',mes:'Toca este mes',prox:'Toca el próximo mes',ok:'Al día',na:'Sin programación',fuera:'Fuera de servicio'};
const TONE={atr:'late',mes:'due',prox:'due',ok:'done',na:'plan',fuera:'plan'};
const tieneSoporte=(it,m)=>!!(it.ejec['m'+m]&&it.ejec['m'+m].soporte);
function celda(it,m){
  const v=it.meses['m'+m];
  if(v==='R')return tieneSoporte(it,m)?'done':'done ns';
  if(v==='P'){const c=cmpMes(m);return c<0?'late':c===0?'due':'plan'}
  if(v==='I')return'ing';
  return'none';
}
function calcular(){
  const tot=Array(13).fill(0),hec=Array(13).fill(0);
  const atr=[],mes=[],prox=[],serv={};
  let rTot=0,rSop=0,eqAtr=0;
  for(const it of items){
    if(it.fuera)continue;
    const s=serv[it.did]||(serv[it.did]={nombre:it.servicio,did:it.did,prog:0,hech:0,atr:0,eq:0});
    s.eq++;if(it.e.st==='atr')eqAtr++;
    for(const m of mesesDe(it)){
      const v=it.meses['m'+m],c=cmpMes(m);tot[m]++;
      if(v==='R'){hec[m]++;rTot++;if(tieneSoporte(it,m))rSop++}
      if(c<0||(c===0&&v==='R')){s.prog++;if(v==='R')s.hech++}
      if(v==='P'){if(c<0){atr.push({it,m});s.atr++}else if(c===0)mes.push({it,m});else if(esSiguiente(m))prox.push({it,m})}
    }
  }
  let prog=0,hech=0;
  for(let m=1;m<=12;m++){const c=cmpMes(m);if(c<0){prog+=tot[m];hech+=hec[m]}else if(c===0){prog+=hec[m];hech+=hec[m]}}
  atr.sort((a,b)=>a.m-b.m||rRank(a.it)-rRank(b.it)||a.it.servicio.localeCompare(b.it.servicio));
  return{tot,hec,prog,hech,atr,mes,prox,serv:Object.values(serv),rTot,rSop,eqAtr};
}

const subEq=it=>[[it.marca,it.modelo].filter(Boolean).join(' '),it.serie&&it.serie!=='N/P'?'Serie '+it.serie:''].filter(Boolean).join(' · ');
const lugar=it=>[it.servicio,it.area&&it.area!==it.servicio?it.area:'',it.ubic].filter(Boolean).join(' · ');

function rowPrev({it,m},k){
  const tone=k==='atr'?'late':'due';
  const n=atraso(m);

  return `<li><button class="row t-${tone}" data-act="verPrev" data-d="${esc(it.did)}" data-id="${esc(it.id)}"><span class="bar"></span><span><b>${esc(it.eq||'Equipo')}</b><span class="sub">${esc(subEq(it))}</span><span class="sub">${esc(lugar(it))}</span></span><span class="rt">${rt}</span></button></li>`;
}
function rowCal(e){
  const tone=TONE_CAL[e.est];
  const sub=[e.marca,e.modelo].filter(Boolean).join(' ')+(e.serie?' · Serie '+e.serie:'');
  const where=[e.servicio,e.ubicacion].filter(Boolean).join(' · ');
  const rt=['ok','por','venc'].includes(e.est)?`${e.est==='venc'?'Calibración vencida':e.est==='por'?'Calibración por vencer':'Calibración vigente'}<span>${fmt(e.vence)}</span>`:e.est==='sin'?'Sin calibración<span>Requiere</span>':EST[e.est];
  return `<li><button class="row t-${tone}" data-act="verEq" data-id="${esc(e.id)}"><span class="bar"></span><span><b>${esc(e.equipo||'Equipo sin nombre')}</b><span class="sub">${esc(sub)}</span><span class="sub">${esc(e.inv&&e.inv!=='N/P'?e.inv+' · ':'')}${esc(where)}</span></span><span class="rt">${rt}</span></button></li>`;
}
const match=(txt,q)=>{const w=q.trim().toLowerCase().split(/\s+/).filter(Boolean);return w.every(x=>txt.includes(x))};

  const vis=list.slice(0,F.cLim);let rows=[],prev=null;

  for(const it of vis){if(!F.cServ&&it.did!==prev){rows.push(`<tr class="grp"><th colspan="14">${esc(it.servicio)}<span>${cnt[it.did]} equipos</span></th></tr>`);prev=it.did}rows.push(filaCrono(it))}
  $('#cBody').innerHTML=`<div class="tablewrap"><table class="crono"><thead><tr><th class="eq">Equipo</th><th class="per">Periodicidad</th>${MES.map((n,i)=>`<th class="mh${cmpMes(i+1)===0?' now':''}">${n}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  $('#cMore').hidden=list.length<=F.cLim;
}

/* ===== CALIBRACIONES ===== */
function renderCal(){
  if(!loadedS){$('#calList').innerHTML='<li>'+cargando+'</li>';return}
  const C=calStats();
  const T=[['venc',C.venc,'Vencidas','late'],['por',C.por,'Vencen en 30 días','due'],['p60',C.soon,'Vencen en 60 días','due'],['sin',C.sin,'Requieren y no tienen calibración','late']];
  $('#calTiles').innerHTML=T.map(([k,l,n,t])=>`<button class="tile t-${t}" data-tile="${k}" aria-pressed="${F.calTile===k}"><strong>${l.length}</strong><span>${n}</span></button>`).join('');
  let list=T.find(t=>t[0]===F.calTile)[1].filter(e=>(!F.calServ||e.sid===F.calServ)&&match(e.txt,F.calq));
  list=list.slice().sort((a,b)=>(a.vence||'9').localeCompare(b.vence||'9')||a.servicio.localeCompare(b.servicio));
  $('#calCount').textContent=`${list.length} equipo${list.length===1?'':'s'}`;
  $('#calList').innerHTML=list.length?list.slice(0,F.calLim).map(rowCal).join(''):'<li class="empty">Nada pendiente aquí.</li>';
  $('#calMore').hidden=list.length<=F.calLim;
}

/* ===== EQUIPOS ===== */
function renderEquipos(){
  if(!loadedS){$('#eList').innerHTML='<li>'+cargando+'</li>';return}

  $('#eCount').textContent=`${f.length} equipo${f.length===1?'':'s'}`;

  $('#eMore').hidden=f.length<=F.eLim;
}

/* ===== hoja lateral ===== */
function openSheet(title,html,mode){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;const s=$('#sheet');s.dataset.mode=mode;s.classList.add('open');s.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('.sheet .card').scrollTop=0;setTimeout(()=>{const f=$('#sheetBody input,#sheetBody select');if(mode==='form'&&f)f.focus()},60)}
function closeSheet(){const s=$('#sheet');s.classList.remove('open');s.setAttribute('aria-hidden','true');document.body.style.overflow='';abierto=null;if(location.search)history.replaceState(null,'',location.pathname+location.hash)}
function refrescarHoja(){
  if(!abierto||$('#sheet').dataset.mode!=='ficha')return;
  if(abierto.t==='eq'){const e=byId(abierto.id);if(e)fichaEquipo(e,true)}

function miniStrip(it){

}

      ${user?`<button class="btn sm" style="margin-top:6px" data-act="mes" data-d="${esc(it.did)}" data-id="${esc(it.id)}" data-m="${m}">${x&&x.soporte?'Editar':'Agregar soporte'}</button>`:''}</li>`);

}

          await setDoc(doc(db,'historial',it.equipoId),{eventos:arrayUnion(evn)},{merge:true});

  const docsAnio=Object.entries(prevDocs).filter(([,d])=>Number(d.anio)===anio).sort((a,b)=>(a[1].servicio||'').localeCompare(b[1].servicio||''));

    <div class="field"><label for="fpPer">Periodicidad</label><select id="fpPer">${opt(['MENSUAL','BIMESTRAL','TRIMESTRAL','CUATRIMESTRAL','SEMESTRAL','ANUAL','NO APLICA'],it.per||'SEMESTRAL')}</select></div>
    ${isNew?`<div class="field w"><label for="fpMes">Primer mes de mantenimiento en ${anio}</label><select id="fpMes">${MESL.map((n,i)=>`<option value="${i+1}" ${i+1===NOW.m?'selected':''}>${Cap(n)}</option>`).join('')}</select><p>Los demás meses se programan solos según la periodicidad. Luego puedes ajustarlos tocando cada mes.</p></div>`:''}
    <div class="actions field w"><button class="btn pri" type="submit">${isNew?'Agregar al cronograma':'Guardar cambios'}</button><button class="btn" type="button" data-act="${isNew?'cerrar':'volverPrev'}">Cancelar</button></div>
  </form>`;
  openSheet(isNew?'Agregar equipo al cronograma':'Editar · '+(it.eq||''),html,'form');

  $('#fpForm').onsubmit=async ev=>{

    const ns=normSerie(data.serie);
    if(ns){const c=equipos.filter(e=>normSerie(e.serie)===ns);if(c.length===1)data.equipoId=c[0].id}

      if(isNew){
        const id='p'+Date.now().toString(36),m1=Number($('#fpMes').value),step=PERIODOS[data.per],meses={};

      }else if(did!==it.did){

        const b=writeBatch(db);
        b.set(doc(db,'preventivos',did),{anio,servicio:nombre,items:{[it.id]:full}},{merge:true});
        b.update(doc(db,'preventivos',it.did),new FieldPath('items',it.id),deleteField());
        await b.commit();
        toast('Cambios guardados');setTimeout(()=>{const n=itemKey(did,it.id);n?fichaPrev(n):closeSheet()},300);

        toast('Cambios guardados');setTimeout(()=>{const n=itemKey(did,it.id);n?fichaPrev(n):closeSheet()},250);
      }
    }catch(err){btn.disabled=false;toast(errMsg(err))}
  };
}

/* ===== ficha del equipo (inventario) ===== */

function fichaEquipo(e,keep){

    <dl class="dl">
      ${dd('Código en la app',e.id.toUpperCase())}${dd('Inventario',e.inv)}

      ${dd('Observaciones',e.obs,true)}

async function loadHist(id){
  let ev=[];
  try{const s=await getDoc(doc(db,'historial',id));if(s.exists())ev=(s.data().eventos||[]).slice()}catch(err){}

function loadXLSX(){
  if(window.XLSX)return Promise.resolve(window.XLSX);
  return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>no(new Error('No se pudo cargar el generador de Excel. Revisa el internet.'));document.head.appendChild(s)});
}
async function descargar(nombre,hojas,btn){
  if(btn){btn.disabled=true;btn.dataset.t=btn.textContent;btn.textContent='Preparando…'}
  try{
    const XLSX=await loadXLSX();const wb=XLSX.utils.book_new();const usados=new Set();
    for(const h of hojas){
      const ws=XLSX.utils.aoa_to_sheet(h.filas);
      (h.links||[]).forEach(([r,c,url])=>{const a=XLSX.utils.encode_cell({r,c});if(ws[a])ws[a].l={Target:url,Tooltip:'Abrir soporte'}});
      if(h.anchos)ws['!cols']=h.anchos.map(w=>({wch:w}));
      if(h.filtro&&ws['!ref']){const rg=XLSX.utils.decode_range(ws['!ref']);rg.s.r=h.filtro;ws['!autofilter']={ref:XLSX.utils.encode_range(rg)}}
      let n=(h.nombre||'Hoja').replace(/[\\/?*[\]:]/g,'-').slice(0,31),k=2;while(usados.has(n))n=n.slice(0,28)+' '+k++;usados.add(n);
      XLSX.utils.book_append_sheet(wb,ws,n);
    }
    XLSX.writeFile(wb,nombre);toast('Archivo descargado');
  }catch(err){toast(err.message||'No se pudo crear el archivo')}
  if(btn){btn.disabled=false;btn.textContent=btn.dataset.t}
}

async function cargarCrono(btn){

async function nuevoAnio(btn){
  const base=Math.max(...anios),next=base+1;
  if(anios.includes(next)){toast('El cronograma de '+next+' ya existe');return}
  if(!confirm(`¿Crear el cronograma de ${next}? Se copian los equipos y los meses de ${base} como programados, sin los registros de realizado.`))return;
  btn.disabled=true;
  try{
    const b=writeBatch(db);
    for(const d of Object.values(prevDocs).filter(d=>Number(d.anio)===base)){
      const its={};
      for(const[id,it] of Object.entries(d.items||{})){const c=Object.assign({},it);delete c.ejec;const ms={};for(const[k,v] of Object.entries(it.meses||{}))if(v==='P'||v==='R')ms[k]='P';c.meses=ms;its[id]=c}
      b.set(doc(db,'preventivos',next+'-'+slug(d.servicio)),{anio:next,servicio:d.servicio,items:its});
    }
    await b.commit();toast('Cronograma de '+next+' creado');
  }catch(err){toast(errMsg(err))}
  btn.disabled=false;
}

    case'editPrev':ip&&formPrev(ip);break;

    case'evento':e&&eventoForm(e);break;
    case'editar':e&&editForm(e,false);break;
    case'doc':e&&docForm(e);break;
    case'volverEq':e?fichaEquipo(e):closeSheet();break;
    case'quitarDoc':if(e&&confirm('¿Quitar este documento de la ficha?')){const l=(e.adjuntos||[]).slice();l.splice(Number(a.dataset.i),1);setDoc(refS(e.sid),{equipos:{[e.id]:{adjuntos:l}}},{merge:true}).then(()=>toast('Documento quitado')).catch(err=>toast(errMsg(err)))}break;
    case'enlace':if(e){const u=location.origin+location.pathname+'?id='+e.id;try{await navigator.clipboard.writeText(u);toast('Enlace copiado')}catch(_){prompt('Copia este enlace:',u)}}break;
    case'baja':if(e&&confirm(e.baja?'¿Reactivar este equipo?':'¿Dar de baja este equipo? Seguirá guardado y lo verás en el filtro "Dados de baja".'))patchEquipo(e,{baja:!e.baja}).then(()=>toast(e.baja?'Equipo reactivado':'Equipo dado de baja')).catch(err=>toast(errMsg(err)));break;
    case'imprimir':if(view!=='inicio')go('inicio');setTimeout(()=>window.print(),300);break;
    case'xMatriz':exportMatriz(a);break;
    case'xCrono':exportCrono(a);break;
    case'xInv':exportInv(a);break;
    case'cargarCrono':cargarCrono(a);break;
    case'nuevoAnio':nuevoAnio(a);break;
  }
});

$('#cServ').onchange=()=>{F.cServ=$('#cServ').value;F.cLim=150;renderCrono()};
$('#cEst').onchange=()=>{F.cEst=$('#cEst').value;F.cLim=150;renderCrono()};
$('#cMes').onchange=()=>{F.cMes=$('#cMes').value;F.cLim=150;renderCrono()};
$('#cAnio').onchange=()=>{anio=Number($('#cAnio').value);rebuildPrev();renderView()};
$('#cMore').onclick=()=>{F.cLim+=200;renderCrono()};
$('#cAdd').onclick=()=>{if(!anios.length&&!Object.keys(prevDocs).length){toast('Primero carga el cronograma en Reportes');return}formPrev(null)};
$('#calq').addEventListener('input',deb(()=>{F.calq=$('#calq').value;F.calLim=80;renderCal()}));
$('#calServ').onchange=()=>{F.calServ=$('#calServ').value;F.calLim=80;renderCal()};
$('#calMore').onclick=()=>{F.calLim+=150;renderCal()};
$('#eq').addEventListener('input',deb(()=>{F.eq=$('#eq').value;F.eLim=80;renderEquipos()}));
$('#eServ').onchange=()=>{F.eServ=$('#eServ').value;F.eLim=80;renderEquipos()};
$('#eEst').onchange=()=>{F.eEst=$('#eEst').value;F.eLim=80;renderEquipos()};
$('#eMore').onclick=()=>{F.eLim+=150;renderEquipos()};
$('#eAdd').onclick=()=>{abierto=null;editForm({},true)};
$('#loginBtn').onclick=()=>user?signOut(auth).then(()=>toast('Sesión cerrada')):loginForm();

/* ===== arranque ===== */
onAuthStateChanged(auth,u=>{user=u;updateAuthUI();if(loadedP)rebuildPrev();renderView();refrescarHoja()});
onSnapshot(collection(db,'servicios'),snap=>{
  const next={};snap.forEach(d=>next[d.id]=d.data());
  servicios=next;const first=!loadedS;loadedS=true;
  rebuildEquipos();if(loadedP)rebuildPrev();
  setStatus(snap.empty?'Todavía no hay equipos en el inventario.':'');
  renderView();refrescarHoja();
  if(first&&loadedP)cargarHist();
  if(first&&urlId){const e=byId(urlId);if(e)fichaEquipo(e);else toast('No se encontró ese equipo')}
},err=>setStatus('No se pudo leer el inventario ('+(err.code||'error')+'). Revisa el internet o las reglas de Firebase.',true));
onSnapshot(collection(db,'preventivos'),snap=>{
  const next={};snap.forEach(d=>next[d.id]=d.data());
  prevDocs=next;const first=!loadedP;loadedP=true;errP=false;
  rebuildPrev();renderView();refrescarHoja();
  if(first&&loadedS)cargarHist();
},err=>{loadedP=true;errP=true;prevDocs={};rebuildPrev();renderView();if(loadedS)cargarHist();setStatus('No se pudo leer el cronograma ('+(err.code||'error')+'). Revisa que las reglas de Firebase permitan leer la colección "preventivos".',true)});
go(location.hash.slice(1)||'inicio');
</script>
</body>
</html>
