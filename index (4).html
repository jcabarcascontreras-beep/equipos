<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hojas de vida de equipos — Clínica La Merced</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#00A19C;
    --verde-hondo:#00716D;
    --verde-agua:#E6F5F4;
    --tinta:#1B2A29;
    --gris:#6A7A79;
    --linea:#DCE5E4;
    --fondo:#F4F7F6;
    --papel:#FFFFFF;
    --ambar:#96601A;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--fondo);color:var(--tinta);
    font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5;font-size:16px;
  }
  .marco{max-width:54rem;margin:0 auto;background:var(--papel);min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.06)}

  /* ---------- cabecera ---------- */
  .cabecera{padding:1.1rem 1.25rem;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:.9rem}
  .marca{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit}
  .simbolo{width:34px;height:34px;flex:0 0 auto}
  .nombre{line-height:1.05}
  .nombre .chico{display:block;font-size:.7rem;letter-spacing:.26em;color:var(--verde);text-transform:lowercase}
  .nombre .grande{display:block;font-size:1.18rem;font-weight:600;color:var(--verde);text-transform:lowercase}
  .seccion-area{margin-left:auto;text-align:right;font-size:.78rem;color:var(--gris);line-height:1.25}

  /* ---------- contenido ---------- */
  .cuerpo{padding:1.5rem 1.25rem 3rem}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 .15rem;letter-spacing:-.01em}
  .sub{color:var(--gris);font-size:.9rem;margin:0 0 1.3rem}

  .buscar{position:relative;margin-bottom:1.6rem}
  .buscar input{
    width:100%;padding:.85rem 1rem;font-size:1rem;font-family:inherit;color:var(--tinta);
    border:1.5px solid var(--linea);border-radius:.45rem;background:var(--papel);
  }
  .buscar input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-agua)}

  /* servicios */
  .rejilla{display:grid;grid-template-columns:1fr;gap:.55rem}
  @media (min-width:34rem){.rejilla{grid-template-columns:1fr 1fr}}
  .tarjeta{
    display:flex;justify-content:space-between;align-items:center;gap:.8rem;
    padding:.9rem 1rem;border:1px solid var(--linea);border-radius:.45rem;
    text-decoration:none;color:inherit;background:var(--papel);
  }
  .tarjeta:hover{border-color:var(--verde);background:var(--verde-agua)}
  .tarjeta .sv{font-weight:500;font-size:.97rem}
  .tarjeta .n{
    flex:0 0 auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem;
    color:var(--verde-hondo);background:var(--verde-agua);padding:.15rem .5rem;border-radius:1rem;
  }

  /* listado de equipos */
  .listado{list-style:none;margin:0;padding:0;border-top:1px solid var(--linea)}
  .listado li{border-bottom:1px solid var(--linea)}
  .listado a{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;text-decoration:none;color:inherit}
  .listado a:hover .eq{color:var(--verde-hondo)}
  .eq{font-weight:500}
  .meta{display:block;font-size:.83rem;color:var(--gris);font-weight:400;margin-top:.1rem}
  .placa{flex:0 0 auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.83rem;color:var(--verde-hondo)}

  .volver{
    display:inline-block;margin-bottom:1.1rem;color:var(--verde-hondo);
    text-decoration:none;font-size:.9rem;font-weight:500;
  }
  .volver:hover{text-decoration:underline}

  /* ficha */
  .ficha-eq{font-size:1.5rem;font-weight:600;margin:0 0 .2rem;letter-spacing:-.01em}
  .ficha-cod{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--verde-hondo);font-size:1rem;margin:0 0 1.3rem}
  .datos{margin:0 0 2rem}
  .par{display:flex;justify-content:space-between;gap:1.2rem;padding:.65rem 0;border-bottom:1px solid var(--linea)}
  .par:first-child{border-top:1px solid var(--linea)}
  .par dt{margin:0;font-size:.9rem;color:var(--gris);flex:0 0 auto}
  .par dd{margin:0;text-align:right;font-weight:500}
  .par dd.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:400;font-size:.92rem}

  h2{font-size:.95rem;font-weight:600;margin:0 0 .6rem;color:var(--gris)}
  .docs{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
  .doc{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:.85rem 1rem;border:1px solid var(--linea);border-radius:.45rem;
    text-decoration:none;color:inherit;
  }
  .doc.listo{border-left:3px solid var(--verde)}
  .doc.listo:hover{background:var(--verde-agua);border-color:var(--verde)}
  .doc.falta{color:var(--gris);background:var(--fondo);border-style:dashed}
  .doc .estado{flex:0 0 auto;font-size:.8rem;color:var(--verde-hondo)}
  .doc.falta .estado{color:var(--ambar)}
  .doc .cargando{color:var(--gris)}

  .aviso{background:var(--verde-agua);border-radius:.45rem;padding:.9rem 1rem;font-size:.87rem;color:var(--verde-hondo);margin-top:1.4rem}
  .vacio{color:var(--gris);padding:2rem 0;text-align:center}

  .pie{
    border-top:1px solid var(--linea);padding:1.2rem 1.25rem 2.5rem;
    display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem;
    font-size:.8rem;color:var(--gris);
  }
  .lema{color:var(--verde);font-style:italic}
  @media (prefers-reduced-motion:no-preference){
    .pantalla{animation:entrar .18s ease-out}
    @keyframes entrar{from{opacity:0}to{opacity:1}}
  }
</style>
</head>

var DOCS = [
  {arch:'hoja-de-vida',       nom:'Hoja de vida'},
  {arch:'calibracion',        nom:'Certificado de calibración'},
  {arch:'mantenimiento',      nom:'Soporte de mantenimiento'},
  {arch:'manual',             nom:'Manual del fabricante'},
  {arch:'invima',             nom:'Registro INVIMA'}
];

var pantalla = document.getElementById('pantalla');
var porId = {};
var porServicio = {};
EQUIPOS.forEach(function(e){
  porId[e.id] = e;
  (porServicio[e.sv] = porServicio[e.sv] || []).push(e);
});
var SERVICIOS = Object.keys(porServicio).sort();

document.getElementById('pie-info').textContent = EQUIPOS.length + ' equipos · actualizado 3 de septiembre de 2026';

function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function idServicio(sv){ return 's/' + encodeURIComponent(sv); }

/* ---------- portada ---------- */
function verPortada(){
  var h = '<h1>Equipos biomédicos</h1>' +
    '<p class="sub">' + EQUIPOS.length + ' equipos en ' + SERVICIOS.length + ' servicios</p>' +
    '<div class="buscar"><input id="q" type="search" placeholder="Buscar equipo, marca, serie o placa" autocomplete="off"></div>' +
    '<div id="resultados"></div>' +
    '<div class="rejilla" id="servicios">';
  SERVICIOS.forEach(function(sv){
    h += '<a class="tarjeta" href="#' + idServicio(sv) + '">' +
         '<span class="sv">' + esc(sv) + '</span>' +
         '<span class="n">' + porServicio[sv].length + '</span></a>';
  });
  h += '</div>';
  pantalla.innerHTML = h;

  var caja = document.getElementById('q');
  var res = document.getElementById('resultados');
  var rejilla = document.getElementById('servicios');

  caja.addEventListener('input', function(){
    var t = caja.value.toLowerCase().trim();
    if (t.length < 2){ res.innerHTML = ''; rejilla.style.display = ''; return; }
    rejilla.style.display = 'none';
    var hits = EQUIPOS.filter(function(e){
      return (e.eq + ' ' + e.ma + ' ' + e.mo + ' ' + e.se + ' ' + e.cod + ' ' + e.ub + ' ' + e.sv).toLowerCase().indexOf(t) !== -1;
    });
    if (!hits.length){ res.innerHTML = '<p class="vacio">Ningún equipo coincide con esa búsqueda.</p>'; return; }
    res.innerHTML = '<p class="sub">' + hits.length + (hits.length === 1 ? ' resultado' : ' resultados') + '</p>' + listaHTML(hits.slice(0, 60), true);
  });
}

function listaHTML(lista, conServicio){
  var h = '<ul class="listado">';
  lista.forEach(function(e){
    var meta = [e.ma, e.mo].filter(Boolean).join(' ');
    meta += (meta && e.ub ? ' · ' : '') + (conServicio ? esc(e.sv) + (e.ub ? ' · ' : '') : '') + esc(e.ub);
    h += '<li><a href="#e/' + encodeURIComponent(e.id) + '">' +
         '<span class="eq">' + esc(e.eq) + '<span class="meta">' + meta + '</span></span>' +
         '<span class="placa">' + esc(e.cod) + '</span></a></li>';
  });
  return h + '</ul>';
}

/* ---------- un servicio ---------- */
function verServicio(sv){
  var lista = porServicio[sv];
  if (!lista){ verPortada(); return; }
  pantalla.innerHTML = '<a class="volver" href="#/">← Todos los servicios</a>' +
    '<h1>' + esc(sv) + '</h1>' +
    '<p class="sub">' + lista.length + ' equipos</p>' +
    listaHTML(lista, false);
}

/* ---------- ficha de un equipo ---------- */
function verEquipo(id){
  var e = porId[id];
  if (!e){ verPortada(); return; }

  var filas = [
    ['Equipo', e.eq, false],
    ['Marca', e.ma, false],
    ['Modelo', e.mo, false],
    ['Serie', e.se, true],
    ['Placa de inventario', e.cod, true],
    ['Servicio', e.sv, false],
    ['Ubicación', e.ub, false],
    ['Registro INVIMA', e.in, true],
    ['Clasificación de riesgo', e.ri, false],
    ['Frecuencia de mantenimiento', e.cr, false]
  ];

  var h = '<a class="volver" href="#' + idServicio(e.sv) + '">← ' + esc(e.sv) + '</a>' +
    '<h1 class="ficha-eq">' + esc(e.eq) + '</h1>' +
    '<p class="ficha-cod">' + esc(e.cod) + '</p><dl class="datos">';
  filas.forEach(function(f){
    if (!f[1]) return;
    h += '<div class="par"><dt>' + f[0] + '</dt><dd' + (f[2] ? ' class="mono"' : '') + '>' + esc(f[1]) + '</dd></div>';
  });
  h += '</dl><h2>Documentos</h2><ul class="docs" id="docs">';
  DOCS.forEach(function(d, i){
    h += '<li><a class="doc" id="doc' + i + '" target="_blank" rel="noopener">' +
         '<span>' + d.nom + '</span><span class="estado cargando">…</span></a></li>';
  });
  h += '</ul>';
  pantalla.innerHTML = h;

  var claves = e.k && e.k.length ? e.k : [e.id];
  DOCS.forEach(function(d, i){
    buscarDoc(document.getElementById('doc' + i), claves, d.arch, 0);
  });
}

/* prueba placa, luego serie, hasta encontrar el archivo */
function buscarDoc(a, claves, sufijo, n){
  if (n >= claves.length){ marcar(a, false); return; }
  var url = 'documentos/' + encodeURIComponent(claves[n] + '-' + sufijo) + '.pdf';
  fetch(url, {method:'HEAD'}).then(function(r){
    if (r.ok){ a.setAttribute('href', url); marcar(a, true); }
    else buscarDoc(a, claves, sufijo, n + 1);
  }).catch(function(){ buscarDoc(a, claves, sufijo, n + 1); });
}

function marcar(a, existe){
  var estado = a.querySelector('.estado');
  estado.classList.remove('cargando');
  if (existe){
    a.classList.add('listo');
    estado.textContent = 'Abrir PDF';
  } else {
    a.classList.add('falta');
    estado.textContent = 'Sin cargar';
    a.removeAttribute('href');
    a.removeAttribute('target');
  }
}

/* ---------- navegación ---------- */
function ruta(){
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.indexOf('e/') === 0) verEquipo(h.slice(2));
  else if (h.indexOf('s/') === 0) verServicio(h.slice(2));
  else verPortada();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', ruta);
ruta();
</script>
