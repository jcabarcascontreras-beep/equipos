<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hojas de vida de equipos — Clínica La Merced</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --verde:#00A19C;
    --verde-hondo:#00716D;
    --verde-agua:#E6F5F4;
    --tinta:#1B2A29;
    --gris:#6A7A79;
    --linea:#DCE5E4;
    --fondo:#F4F7F6;
    --papel:#FFFFFF;
    --ambar:#96601A;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--fondo);color:var(--tinta);
    font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.5;font-size:16px;
  }
  .marco{max-width:54rem;margin:0 auto;background:var(--papel);min-height:100vh;box-shadow:0 0 30px rgba(0,0,0,.06)}

  /* ---------- cabecera ---------- */
  .cabecera{padding:1.1rem 1.25rem;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:.9rem}
  .marca{display:flex;align-items:center;gap:.75rem;text-decoration:none;color:inherit}
  .simbolo{width:34px;height:34px;flex:0 0 auto}
  .nombre{line-height:1.05}
  .nombre .chico{display:block;font-size:.7rem;letter-spacing:.26em;color:var(--verde);text-transform:lowercase}
  .nombre .grande{display:block;font-size:1.18rem;font-weight:600;color:var(--verde);text-transform:lowercase}
  .seccion-area{margin-left:auto;text-align:right;font-size:.78rem;color:var(--gris);line-height:1.25}

  /* ---------- contenido ---------- */
  .cuerpo{padding:1.5rem 1.25rem 3rem}
  h1{font-size:1.5rem;font-weight:600;margin:0 0 .15rem;letter-spacing:-.01em}
  .sub{color:var(--gris);font-size:.9rem;margin:0 0 1.3rem}

  .buscar{position:relative;margin-bottom:1.6rem}
  .buscar input{
    width:100%;padding:.85rem 1rem;font-size:1rem;font-family:inherit;color:var(--tinta);
    border:1.5px solid var(--linea);border-radius:.45rem;background:var(--papel);
  }
  .buscar input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-agua)}

  /* servicios */
  .rejilla{display:grid;grid-template-columns:1fr;gap:.55rem}
  @media (min-width:34rem){.rejilla{grid-template-columns:1fr 1fr}}
  .tarjeta{
    display:flex;justify-content:space-between;align-items:center;gap:.8rem;
    padding:.9rem 1rem;border:1px solid var(--linea);border-radius:.45rem;
    text-decoration:none;color:inherit;background:var(--papel);
  }
  .tarjeta:hover{border-color:var(--verde);background:var(--verde-agua)}
  .tarjeta .sv{font-weight:500;font-size:.97rem}
  .tarjeta .n{
    flex:0 0 auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.85rem;
    color:var(--verde-hondo);background:var(--verde-agua);padding:.15rem .5rem;border-radius:1rem;
  }

  /* listado de equipos */
  .listado{list-style:none;margin:0;padding:0;border-top:1px solid var(--linea)}
  .listado li{border-bottom:1px solid var(--linea)}
  .listado a{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.8rem 0;text-decoration:none;color:inherit}
  .listado a:hover .eq{color:var(--verde-hondo)}
  .eq{font-weight:500}
  .meta{display:block;font-size:.83rem;color:var(--gris);font-weight:400;margin-top:.1rem}
  .placa{flex:0 0 auto;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:.83rem;color:var(--verde-hondo)}

  .volver{
    display:inline-block;margin-bottom:1.1rem;color:var(--verde-hondo);
    text-decoration:none;font-size:.9rem;font-weight:500;
  }
  .volver:hover{text-decoration:underline}

  /* ficha */
  .ficha-eq{font-size:1.5rem;font-weight:600;margin:0 0 .2rem;letter-spacing:-.01em}
  .ficha-cod{font-family:"IBM Plex Mono",ui-monospace,monospace;color:var(--verde-hondo);font-size:1rem;margin:0 0 1.3rem}
  .datos{margin:0 0 2rem}
  .par{display:flex;justify-content:space-between;gap:1.2rem;padding:.65rem 0;border-bottom:1px solid var(--linea)}
  .par:first-child{border-top:1px solid var(--linea)}
  .par dt{margin:0;font-size:.9rem;color:var(--gris);flex:0 0 auto}
  .par dd{margin:0;text-align:right;font-weight:500}
  .par dd.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:400;font-size:.92rem}

  h2{font-size:.95rem;font-weight:600;margin:0 0 .6rem;color:var(--gris)}
  .docs{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
  .doc{
    display:flex;justify-content:space-between;align-items:center;gap:1rem;
    padding:.85rem 1rem;border:1px solid var(--linea);border-radius:.45rem;
    text-decoration:none;color:inherit;
  }
  .doc.listo{border-left:3px solid var(--verde)}
  .doc.listo:hover{background:var(--verde-agua);border-color:var(--verde)}
  .doc.falta{color:var(--gris);background:var(--fondo);border-style:dashed}
  .doc .estado{flex:0 0 auto;font-size:.8rem;color:var(--verde-hondo)}
  .doc.falta .estado{color:var(--ambar)}
  .doc .cargando{color:var(--gris)}

  .aviso{background:var(--verde-agua);border-radius:.45rem;padding:.9rem 1rem;font-size:.87rem;color:var(--verde-hondo);margin-top:1.4rem}
  .vacio{color:var(--gris);padding:2rem 0;text-align:center}

  .recientes{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin:-1rem 0 1.4rem}
  .recientes span{font-size:.82rem;color:var(--gris)}
  .chip{
    font-size:.85rem;padding:.3rem .7rem;border:1px solid var(--linea);
    border-radius:1rem;color:var(--verde-hondo);text-decoration:none;background:var(--papel);
  }
  .chip:hover{border-color:var(--verde);background:var(--verde-agua)}

  /* pantalla de acceso */
  #acceso{padding:3.5rem 1.25rem 4rem;text-align:center}
  #acceso h1{font-size:1.3rem;margin:0 0 .3rem}
  #acceso p{color:var(--gris);font-size:.9rem;margin:0 0 1.6rem}
  #acceso form{display:flex;flex-direction:column;gap:.7rem;max-width:20rem;margin:0 auto}
  #acceso input{
    padding:.85rem 1rem;font-size:1rem;font-family:inherit;text-align:center;
    border:1.5px solid var(--linea);border-radius:.45rem;letter-spacing:.05em;
  }
  #acceso input:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px var(--verde-agua)}
  #acceso button{
    padding:.85rem 1rem;font-size:1rem;font-family:inherit;font-weight:600;
    background:var(--verde);color:#fff;border:0;border-radius:.45rem;cursor:pointer;
  }
  #acceso button:hover{background:var(--verde-hondo)}
  #error{color:#A3322B;font-size:.88rem;min-height:1.2rem;margin:.2rem 0 0}
  .oculto{display:none}

  .pie{
    border-top:1px solid var(--linea);padding:1.2rem 1.25rem 2.5rem;
    display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4rem;
    font-size:.8rem;color:var(--gris);
  }
  .lema{color:var(--verde);font-style:italic}
  @media (prefers-reduced-motion:no-preference){
    .pantalla{animation:entrar .18s ease-out}
    @keyframes entrar{from{opacity:0}to{opacity:1}}
  }
</style>
</head>
<body>
<div class="marco">

  <div class="cabecera">
    <a class="marca" href="#/">
      <!-- Para usar el logo real: borra este <svg> y pon  <img class="simbolo" src="logo.png" alt="">  -->
      <svg class="simbolo" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="17" cy="23" r="12" fill="none" stroke="#00A19C" stroke-width="2.4"/>
        <circle cx="17" cy="23" r="3.4" fill="#00A19C"/>
        <path d="M27 6 L31 14 L23 19" fill="none" stroke="#00A19C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="nombre">
        <span class="chico">clínica</span>
        <span class="grande">la merced</span>
      </span>
    </a>
    <span class="seccion-area">Electromedicina<br>Hojas de vida</span>
  </div>

  <div id="acceso">
    <h1>Acceso restringido</h1>
    <p>Información interna del departamento de Electromedicina.</p>
    <form id="formAcceso">
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="off" autocapitalize="characters">
      <button type="submit">Entrar</button>
      <p id="error"></p>
    </form>
  </div>

  <div class="cuerpo oculto" id="pantalla"></div>

  <div class="pie">
    <span class="lema">por tu bien</span>
    <span id="pie-info"></span>
  </div>

</div>

function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
function idServicio(sv){ return 's/' + encodeURIComponent(sv); }

/* ---------- portada ---------- */
function verPortada(inicial){
  inicial = inicial || '';
  var h = '<h1>Equipos biomédicos</h1>' +
    '<p class="sub">' + EQUIPOS.length + ' equipos en ' + SERVICIOS.length + ' servicios</p>' +
    '<div class="buscar"><input id="q" type="search" value="' + esc(inicial) +
    '" placeholder="Buscar equipo, marca, serie o placa" autocomplete="off"></div>' +
    chipsHTML() +
    '<div id="resultados"></div>' +
    '<div class="rejilla" id="servicios">';
  SERVICIOS.forEach(function(sv){
    h += '<a class="tarjeta" href="#' + idServicio(sv) + '">' +
         '<span class="sv">' + esc(sv) + '</span>' +
         '<span class="n">' + porServicio[sv].length + '</span></a>';
  });
  h += '</div>';
  h += '<a class="tarjeta" style="margin-top:1.1rem" href="#c/">' +
       '<span class="sv">Otros inventarios de equipos biomédicos<span class="detalle">Equipos en comodato</span></span>' +
       '<span class="n">' + COMODATO.length + '</span></a>';
  pantalla.innerHTML = h;

  var caja = document.getElementById('q');
  var res = document.getElementById('resultados');
  var rejilla = document.getElementById('servicios');

  function pintar(){
    var t = caja.value.toLowerCase().trim();
    busquedaActual = t;
    if (t.length < 2){
      res.innerHTML = ''; rejilla.style.display = '';
      if (location.hash.indexOf('#b/') === 0) history.replaceState(null, '', '#/');
      return;
    }
    rejilla.style.display = 'none';
    history.replaceState(null, '', '#b/' + encodeURIComponent(t));
    var hits = buscarEn(EQUIPOS, t);
    if (!hits.length){ res.innerHTML = '<p class="vacio">Ningún equipo coincide con esa búsqueda.</p>'; return; }
    res.innerHTML = '<p class="sub">' + hits.length + (hits.length === 1 ? ' resultado' : ' resultados') + '</p>' +
                    listaHTML(hits.slice(0, 60), true);
  }

  caja.addEventListener('input', pintar);
  if (inicial) pintar();
}

/* ---------- últimas búsquedas ---------- */
var busquedaActual = '';

function recientes(){
  try { return JSON.parse(sessionStorage.getItem('busq') || '[]'); } catch(e){ return []; }
}

function guardarBusqueda(t){
  if (!t || t.length < 2) return;
  var l = recientes().filter(function(x){ return x !== t; });
  l.unshift(t);
  try { sessionStorage.setItem('busq', JSON.stringify(l.slice(0, 3))); } catch(e){}
}

function chipsHTML(){
  var l = recientes();
  if (!l.length) return '';
  var h = '<div class="recientes"><span>Recientes:</span>';
  l.forEach(function(t){
    h += '<a class="chip" href="#b/' + encodeURIComponent(t) + '">' + esc(t) + '</a>';
  });
  return h + '</div>';
}

function listaHTML(lista, conServicio){
  var h = '<ul class="listado">';
  lista.forEach(function(e){
    var meta = [e.ma, e.mo].filter(Boolean).join(' ');
    meta += (meta && e.ub ? ' · ' : '') + (conServicio ? esc(e.sv) + (e.ub ? ' · ' : '') : '') + esc(e.ub);
    h += '<li><a href="#e/' + encodeURIComponent(e.id) + '">' +
         '<span class="eq">' + esc(e.eq) + '<span class="meta">' + meta + '</span></span>' +
         '<span class="placa">' + esc(e.co ? e.se : e.cod) + '</span></a></li>';
  });
  return h + '</ul>';
}

    '<h1>' + esc(sv) + '</h1>' +

function buscarEn(lista, t){
  return lista.filter(function(e){
    return (e.eq + ' ' + e.ma + ' ' + e.mo + ' ' + e.se + ' ' + (e.cod || '') + ' ' +
            e.ub + ' ' + e.sv + ' ' + (e.co || '')).toLowerCase().indexOf(t) !== -1;
  });
}

function verEquipo(id){
  var e = porId[id];
  if (!e){ verPortada(); return; }
  if (e.co){ verEquipoComodato(e); return; }

  var filas = [
    ['Equipo', e.eq, false],
    ['Marca', e.ma, false],
    ['Modelo', e.mo, false],
    ['Serie', e.se, true],
    ['Placa de inventario', e.cod, true],
    ['Servicio', e.sv, false],
    ['Ubicación', e.ub, false],
    ['Registro INVIMA', e.in, true],
    ['Clasificación de riesgo', e.ri, false],
    ['Frecuencia de mantenimiento', e.cr, false]
  ];

  var h = '<a class="volver" href="#' + idServicio(e.sv) + '">← ' + esc(e.sv) + '</a>' +
    '<h1 class="ficha-eq">' + esc(e.eq) + '</h1>' +
    '<p class="ficha-cod">' + esc(e.cod) + '</p><dl class="datos">';
  filas.forEach(function(f){
    if (!f[1]) return;
    h += '<div class="par"><dt>' + f[0] + '</dt><dd' + (f[2] ? ' class="mono"' : '') + '>' + esc(f[1]) + '</dd></div>';
  });
  var DOCS = docsDe(e);
  h += '</dl><h2>Documentos</h2><ul class="docs" id="docs">';
  DOCS.forEach(function(d, i){
    h += '<li><a class="doc" id="doc' + i + '" target="_blank" rel="noopener">' +
         '<span>' + d.nom + '</span><span class="estado cargando">…</span></a></li>';
  });
  h += '</ul>';
  if (!e.nm){
    h += '<h2>Mantenimientos preventivos</h2><ul class="docs" id="mant">' +
         '<li><span class="doc"><span>Buscando soportes…</span></span></li></ul>';
  }
  h += '<h2>Otros documentos</h2><ul class="docs" id="otros">' +
       '<li><span class="doc"><span>Buscando…</span></span></li></ul>';
  pantalla.innerHTML = h;

  var propias = e.k && e.k.length ? e.k : [e.id];
  DOCS.forEach(function(d, i){
    // manual e INVIMA también valen por marca y modelo, para no repetir el mismo PDF
    var claves = d.compartido ? propias.concat(e.m || []) : propias;
    if (d.arch === 'invima' && e.r) claves = claves.concat([e.r]);
    buscarDoc(document.getElementById('doc' + i), claves, d.arch, 0);
  });
  if (!e.nm) buscarMantenimientos(propias);
  buscarOtros(propias.concat(e.m || []));
}

function buscarOtros(claves){
  buscarLista(document.getElementById('otros'), claves, OTROS, 'Sin documentos adicionales');
}

/* ---------- mantenimientos: se muestran todos, del más nuevo al más viejo ---------- */
var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
             'agosto','septiembre','octubre','noviembre','diciembre'];

function buscarMantenimientos(claves){
  var caja = document.getElementById('mant');
  var intentos = [];
  claves.slice(0, 2).forEach(function(c){
    intentos.push({url:'documentos/' + encodeURIComponent(c + '-mantenimientos') + '.pdf',
                   orden:0, txt:'Historial anterior (varios años en un archivo)'});
    ANIOS.forEach(function(y){
      for (var m = 1; m <= 12; m++){
        var mm = (m < 10 ? '0' : '') + m;
        intentos.push({
          url:'documentos/' + encodeURIComponent(c + '-mantenimiento-' + y + '-' + mm) + '.pdf',
          orden: y * 100 + m,
          txt: MESES[m-1].charAt(0).toUpperCase() + MESES[m-1].slice(1) + ' de ' + y
        });
      }
    });
  });

  var hallados = [], pendientes = intentos.length;
  intentos.forEach(function(t){
    fetch(t.url, {method:'HEAD'}).then(function(r){
      if (r.ok) hallados.push(t);
    }).catch(function(){}).then(function(){
      if (--pendientes === 0) pintarMantenimientos(caja, hallados);
    });
  });
}

function pintarMantenimientos(caja, lista){
  if (!lista.length){
    caja.innerHTML = '<li><span class="doc falta"><span>Sin soportes cargados</span>' +
                     '<span class="estado">Sin cargar</span></span></li>';
    return;
  }
  var vistos = {};
  lista.sort(function(a,b){ return b.orden - a.orden; });
  var h = '';
  lista.forEach(function(t){
    if (vistos[t.orden]) return;
    vistos[t.orden] = 1;
    h += '<li><a class="doc listo" href="' + t.url + '" target="_blank" rel="noopener">' +
         '<span>' + t.txt + '</span><span class="estado">Abrir PDF</span></a></li>';
  });
  caja.innerHTML = h;
}

       '<li><span class="doc"><span>Buscando…</span></span></li></ul>';
  pantalla.innerHTML = h;

  buscarLista(document.getElementById('otros'), e.k, DOCS_COMODATO, 'Sin documentos cargados');
}

/* busca una lista de documentos y muestra solo los que existen */
function buscarLista(caja, claves, defs, vacio){
  claves = claves.slice(0, 4);
  var hallados = [], pendientes = defs.length * claves.length;
  defs.forEach(function(d, i){
    claves.forEach(function(c){
      var url = 'documentos/' + encodeURIComponent(c + '-' + d.arch) + '.pdf';
      fetch(url, {method:'HEAD'}).then(function(r){
        if (r.ok) hallados.push({orden:i, txt:d.nom, url:url});
      }).catch(function(){}).then(function(){
        if (--pendientes === 0) pintarLista(caja, hallados, vacio);
      });
    });
  });
}

function pintarLista(caja, lista, vacio){
  if (!lista.length){
    caja.innerHTML = '<li><span class="doc falta"><span>' + vacio + '</span>' +
                     '<span class="estado">Sin cargar</span></span></li>';
    return;
  }
  lista.sort(function(a,b){ return a.orden - b.orden; });
  var vistos = {}, h = '';
  lista.forEach(function(t){
    if (vistos[t.orden]) return;
    vistos[t.orden] = 1;
    h += '<li><a class="doc listo" href="' + t.url + '" target="_blank" rel="noopener">' +
         '<span>' + t.txt + '</span><span class="estado">Abrir PDF</span></a></li>';
  });
  caja.innerHTML = h;
}

/* prueba placa, luego serie, hasta encontrar el archivo */
function buscarDoc(a, claves, sufijo, n){
  if (n >= claves.length){ marcar(a, false); return; }
  var url = 'documentos/' + encodeURIComponent(claves[n] + '-' + sufijo) + '.pdf';
  fetch(url, {method:'HEAD'}).then(function(r){
    if (r.ok){ a.setAttribute('href', url); marcar(a, true); }
    else buscarDoc(a, claves, sufijo, n + 1);
  }).catch(function(){ buscarDoc(a, claves, sufijo, n + 1); });
}

function marcar(a, existe){
  var estado = a.querySelector('.estado');
  estado.classList.remove('cargando');
  if (existe){
    a.classList.add('listo');
    estado.textContent = 'Abrir PDF';
  } else {
    a.classList.add('falta');
    estado.textContent = 'Sin cargar';
    a.removeAttribute('href');
    a.removeAttribute('target');
  }
}

/* ---------- navegación ---------- */
function ruta(){
  var h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (h.indexOf('bc/') === 0){ verComodatoIndex(h.slice(3)); window.scrollTo(0,0); return; }
  if (h.indexOf('c/') === 0){
    var g = h.slice(2);
    if (g) verComodato(g); else verComodatoIndex('');
    window.scrollTo(0,0); return;
  }
  if (h.indexOf('e/') === 0){
    guardarBusqueda(busquedaActual);
    verEquipo(h.slice(2));
  }
  else if (h.indexOf('s/') === 0) verServicio(h.slice(2));
  else if (h.indexOf('b/') === 0) verPortada(h.slice(2));
  else { busquedaActual = ''; verPortada(); }
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', ruta);

/* ---------- acceso ---------- */
var CLAVE = '0808';
var acceso = document.getElementById('acceso');
var pie = document.querySelector('.pie');
pie.classList.add('oculto');

function abrir(){
  acceso.classList.add('oculto');
  pantalla.classList.remove('oculto');
  pie.classList.remove('oculto');
  ruta();
}

document.getElementById('formAcceso').addEventListener('submit', function(ev){
  ev.preventDefault();
  var v = document.getElementById('clave').value.trim().toUpperCase();
  if (v === CLAVE){
    abrir();
  } else {
    document.getElementById('error').textContent = 'Contraseña incorrecta.';
    document.getElementById('clave').value = '';
  }
});

document.getElementById('clave').focus();
